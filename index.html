const Demo={
  state:async()=>{await wait(200);const d=dLoad();return{subs:d.subs,favs:d.favs,history:d.history};},
  create:async b=>{await wait(150);const d=dLoad();const s={...b,id:Date.now(),position:d.subs.length,created_at:new Date().toISOString()};d.subs.push(s);dSave(d);return s;},
  update:async(id,b)=>{await wait(120);const d=dLoad();const i=d.subs.findIndex(s=>s.id==id);if(i>-1)d.subs[i]={...d.subs[i],...b};dSave(d);},
  remove:async ids=>{await wait(120);const d=dLoad();d.subs=d.subs.filter(s=>!ids.includes(s.id));dSave(d);},
  pause:async(id,p)=>{await wait(100);const d=dLoad();const s=d.subs.find(s=>s.id==id);if(s)s.is_paused=p;dSave(d);},
  reorder:async ids=>{await wait(100);const d=dLoad();ids.forEach((id,i)=>{const s=d.subs.find(x=>x.id==id);if(s)s.position=i;});dSave(d);},
  addFav:async z=>{await wait(100);const d=dLoad();if(!d.favs.find(f=>f.reg_number===z.reg_number))d.favs.unshift({...z,added_at:new Date().toISOString()});dSave(d);},
  delFav:async reg=>{await wait(100);const d=dLoad();d.favs=d.favs.filter(f=>f.reg_number!==reg);dSave(d);},
  clearHist:async()=>{await wait(100);const d=dLoad();d.history=[];dSave(d);},
  search:async(limit,subId)=>{await wait(900);const d=dLoad();const subs=subId?d.subs.filter(s=>s.id==subId):d.subs.filter(s=>!s.is_paused);
    const cust=["ГБУ «Жилищник»","МКУ «Центр закупок»","ФГБУ «Наука»","АО «Гортранс»"];const regs=["Москва","Санкт-Петербург","Московская обл","Самарская обл"];const out=[];
    subs.forEach((s,si)=>{for(let i=0;i<Math.min(limit,3+si);i++){const days=2+((si*3+i*5)%18);const dl=new Date(Date.now()+days*864e5);const price=Math.round((30000+((si+1)*(i+2)*47000)%1900000)*100)/100;
      out.push({reg_number:String(373200041126000745+si*1000+i),title:`Поставка: ${s.keyword} для нужд ${cust[(si+i)%cust.length]} (лот ${i+1})`,price:price.toLocaleString("ru-RU",{minimumFractionDigits:2})+" ₽",region:s.region||regs[(si+i)%regs.length],deadline:`${String(dl.getDate()).padStart(2,"0")}.${String(dl.getMonth()+1).padStart(2,"0")}.${dl.getFullYear()} 09:00`,customer:cust[(si+i)%cust.length],link:"https://zakupki.gov.ru/",sub_id:s.id,keyword:s.keyword});}});
    d.history.unshift({id:Date.now(),query:subs.map(s=>s.keyword).join(", ")||"—",limit_count:limit,found_count:out.length,searched_at:new Date().toISOString()});dSave(d);return{results:out,found:out.length};}
};
const API=()=>S.mode==="live"?Live:Demo;

/* ---- ui ---- */
function toast(m,t="ok"){const e=document.createElement("div");e.className="toast "+(t==="ok"?"":t);e.textContent=m;$("#toasts").appendChild(e);setTimeout(()=>{e.style.opacity="0";setTimeout(()=>e.remove(),300);},2600);}
let st=null;function snack(m,fn){$("#snackTxt").textContent=m;S.undo=fn;$("#snack").classList.add("on");clearTimeout(st);st=setTimeout(()=>$("#snack").classList.remove("on"),6000);}
$("#snackAct").onclick=()=>{if(S.undo)S.undo();S.undo=null;$("#snack").classList.remove("on");};
function openDrawer(h){$("#drawer").innerHTML=h;$("#drawer").classList.add("on");$("#scrim").classList.add("on");}
function closeDrawer(){$("#drawer").classList.remove("on");$("#scrim").classList.remove("on");}
$("#scrim").onclick=closeDrawer;window.closeDrawer=closeDrawer;
const TABS=[["subs","📋","Подписки"],["search","📡","Поиск"],["fav","⭐","Избранное"],["hist","🕘","История"]];
function buildNav(){$("#tabbar").innerHTML=TABS.map(t=>`<button data-v="${t[0]}" class="${S.view===t[0]?"on":""}"><i>${t[1]}</i>${t[2]}</button>`).join("");
 $("#rail").innerHTML=TABS.map(t=>`<button data-v="${t[0]}" class="${S.view===t[0]?"on":""}" title="${t[2]}">${t[1]}</button>`).join("");
 $$("#tabbar button,#rail button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render();});}
function render(){buildNav();$$(".view").forEach(v=>v.classList.remove("on"));$("#v-"+S.view).classList.add("on");
 $("#stActive").textContent=S.subs.filter(s=>!s.is_paused).length;$("#stFav").textContent=S.favs.length;
 const td=new Date().toDateString();$("#stFound").textContent=S.history.filter(h=>new Date(h.searched_at).toDateString()===td).reduce((a,h)=>a+(h.found_count||0),0);
 const h=new Date().getHours();$("#stNext").textContent=h<9?"09:00":h<18?"18:00":"09:00";
 if(S.view==="subs")renderSubs();if(S.view==="search")renderSearch();if(S.view==="fav")renderFavs();if(S.view==="hist")renderHist();}
function filteredSubs(){let l=[...S.subs];
 if(S.saved==="active")l=l.filter(s=>!s.is_paused);if(S.saved==="paused")l=l.filter(s=>s.is_paused);
 if(S.saved==="44")l=l.filter(s=>s.fz44);if(S.saved==="223")l=l.filter(s=>s.fz223);
 if(S.filter){const f=S.filter.toLowerCase();l=l.filter(s=>(s.keyword+" "+s.region).toLowerCase().includes(f));}
 if(S.sort==="new")l.sort((a,b)=>b.id-a.id);if(S.sort==="kw")l.sort((a,b)=>a.keyword.localeCompare(b.keyword,"ru"));
 if(S.sort==="price")l.sort((a,b)=>(b.max_price||0)-(a.max_price||0));if(S.sort==="pos")l.sort((a,b)=>(a.position||0)-(b.position||0));return l;}
function subCard(s,i){const tags=[s.fz44?'<span class="tag law">44-ФЗ</span>':"",s.fz223?'<span class="tag law">223-ФЗ</span>':"",
 s.region?`<span class="tag reg">📍 ${esc(s.region)}</span>`:"",(s.min_price||(s.max_price&&s.max_price<9999999999))?`<span class="tag price">💰 ${s.min_price?fmtMoney(s.min_price):"0"} – ${s.max_price&&s.max_price<9999999999?fmtMoney(s.max_price):"∞"} ₽</span>`:"",
 `<span class="tag time">${{both:"🌅🌆 2 раза",morning:"🌅 утро",evening:"🌆 вечер"}[s.notify_time]||"🌅🌆"}</span>`].join("");
 return `<div class="card ${s.is_paused?"paused":""} ${S.sel.has(s.id)?"sel":""}" draggable="${S.sort==="pos"&&!S.bulk}" data-id="${s.id}" style="animation-delay:${i*40}ms">
 <div class="row1">${S.bulk?`<input type="checkbox" class="check" data-id="${s.id}" ${S.sel.has(s.id)?"checked":""}>`:""}<div class="kw">🔑 ${esc(s.keyword)}</div>
 <div class="acts"><button class="btn ghost icon" data-act="edit" data-id="${s.id}">✏️</button><button class="btn ghost icon" data-act="pause" data-id="${s.id}">${s.is_paused?"▶️":"⏸️"}</button><button class="btn danger icon" data-act="del" data-id="${s.id}">🗑</button></div></div>
 <div class="tags">${tags}</div><div class="statusline"><span class="pill ${s.is_paused?"off":"on"}">${s.is_paused?"⏸ на паузе":"● активна"}</span><span class="meta">до ${s.per_check||5} закупок за проверку</span></div></div>`;}
function renderSubs(){const l=filteredSubs();
 $("#subsList").innerHTML=l.length?l.map(subCard).join(""):`<div class="empty"><div class="ico">📭</div><p>Подписок пока нет.<br>Нажмите «＋ Подписка».</p></div>`;
 $("#bulkbar").classList.toggle("on",S.bulk);$("#bulkCount").textContent=S.sel.size+" выбрано";
 $$("#subsList [data-act]").forEach(b=>b.onclick=e=>{e.stopPropagation();const id=+b.dataset.id;
  if(b.dataset.act==="edit")openSubDrawer(S.subs.find(s=>s.id===id));
  if(b.dataset.act==="pause")doPause(id);if(b.dataset.act==="del")doDelete([id]);});
 $$("#subsList .check").forEach(c=>c.onchange=()=>{const id=+c.dataset.id;c.checked?S.sel.add(id):S.sel.delete(id);renderSubs();});
 $$("#subsList .card").forEach(card=>{card.ondragstart=e=>e.dataTransfer.setData("text/plain",card.dataset.id);
  card.ondragover=e=>e.preventDefault();
  card.ondrop=async e=>{e.preventDefault();const from=+e.dataTransfer.getData("text/plain"),to=+card.dataset.id;if(from===to)return;
   const ids=filteredSubs().map(s=>s.id);const a=ids.indexOf(from),b=ids.indexOf(to);ids.splice(a,1);ids.splice(b,0,from);
   S.subs.sort((x,y)=>ids.indexOf(x.id)-ids.indexOf(y.id));S.subs.forEach((s,i)=>s.position=i);renderSubs();
   try{await API().reorder(ids);}catch(err){toast("Не удалось сохранить порядок","err");}};});}
$("#flt").oninput=e=>{S.filter=e.target.value;renderSubs();};
$("#sortSel").onchange=e=>{S.sort=e.target.value;renderSubs();};
$("#viewSel").onchange=e=>{S.saved=e.target.value;renderSubs();};
$("#bulkBtn").onclick=()=>{S.bulk=!S.bulk;S.sel.clear();renderSubs();};
$("#bulkCancel").onclick=()=>{S.bulk=false;S.sel.clear();renderSubs();};
$("#bulkDel").onclick=()=>doDelete([...S.sel]);
$("#newBtn").onclick=()=>openSubDrawer(null);
async function doPause(id){const s=S.subs.find(x=>x.id===id);if(!s)return;const old=s.is_paused;s.is_paused=!old;render();
 try{await API().pause(id,s.is_paused);toast(s.is_paused?"⏸ На паузе":"▶️ Активна");}catch(e){s.is_paused=old;render();toast("Ошибка","err");}}
async function doDelete(ids){if(!ids.length)return;const removed=S.subs.filter(s=>ids.includes(s.id));
 S.subs=S.subs.filter(s=>!ids.includes(s.id));S.sel.clear();S.bulk=false;render();
 snack(`Удалено: ${removed.length}`,async()=>{S.subs.push(...removed);render();try{for(const r of removed)await API().create(r);}catch(e){}});
 try{await API().remove(ids);toast("🗑 Удалено");}catch(e){S.subs.push(...removed);render();toast("Ошибка удаления","err");}}
function openSubDrawer(s){const isEdit=!!s;s=s||{keyword:"",fz44:true,fz223:true,region:"",min_price:0,max_price:0,notify_time:"both",per_check:5};
 openDrawer(`<h2>${isEdit?"✏️ Редактирование":"＋ Новая подписка"}<button class="btn ghost icon" onclick="closeDrawer()">✕</button></h2>
 <div class="fg"><label>Ключевое слово *</label><input type="text" id="dKw" value="${esc(s.keyword)}" placeholder="например: бумага офисная"></div>
 <div class="fg"><label>Законы</label><div class="laws"><div class="law ${s.fz44?"on":""}" id="dL44">44-ФЗ</div><div class="law ${s.fz223?"on":""}" id="dL223">223-ФЗ</div></div></div>
 <div class="fg"><label>Регион</label><input type="text" id="dReg" list="regs" value="${esc(s.region)}" placeholder="Москва, Самарская область…"><datalist id="regs"><option>Москва</option><option>Московская область</option><option>Санкт-Петербург</option><option>Самарская область</option><option>Краснодарский край</option><option>Свердловская область</option><option>Новосибирская область</option><option>Татарстан</option><option>Ростовская область</option><option>Нижегородская область</option></datalist></div>
 <div class="two"><div class="fg"><label>Цена от, ₽</label><input type="number" id="dMin" value="${s.min_price||""}" placeholder="0"></div><div class="fg"><label>Цена до, ₽</label><input type="number" id="dMax" value="${s.max_price&&s.max_price<9999999999?s.max_price:""}" placeholder="∞"></div></div>
 <div class="fg"><label>Уведомления</label><select id="dNt" style="width:100%"><option value="both" ${s.notify_time==="both"?"selected":""}>Утром и вечером</option><option value="morning" ${s.notify_time==="morning"?"selected":""}>Только утром (09:00)</option><option value="evening" ${s.notify_time==="evening"?"selected":""}>Только вечером (18:00)</option></select></div>
 <div class="fg"><label>Закупок за одну проверку</label><div class="stepper"><button id="dMinus">−</button><b id="dPer">${s.per_check||5}</b><button id="dPlus">＋</button></div></div>
 <button class="btn" id="dSave" style="width:100%">💾 ${isEdit?"Сохранить изменения":"Создать подписку"}</button>
 ${isEdit?`<button class="btn danger" id="dDel" style="width:100%;margin-top:8px">🗑 Удалить подписку</button>`:""}`);
 $("#dL44").onclick=()=>$("#dL44").classList.toggle("on");$("#dL223").onclick=()=>$("#dL223").classList.toggle("on");
 let per=s.per_check||5;$("#dMinus").onclick=()=>{per=Math.max(1,per-1);$("#dPer").textContent=per;};$("#dPlus").onclick=()=>{per=Math.min(50,per+1);$("#dPer").textContent=per;};
 $("#dSave").onclick=async()=>{const kw=$("#dKw").value.trim();if(!kw){toast("Введите ключевое слово","err");return;}
  if(!$("#dL44").classList.contains("on")&&!$("#dL223").classList.contains("on")){toast("Выберите хотя бы один закон","err");return;}
  const body={keyword:kw,fz44:$("#dL44").classList.contains("on"),fz223:$("#dL223").classList.contains("on"),region:$("#dReg").value.trim(),min_price:+$("#dMin").value||0,max_price:+$("#dMax").value||0,notify_time:$("#dNt").value,per_check:per};
  closeDrawer();
  if(isEdit){const tgt=S.subs.find(x=>x.id===s.id);const old={...tgt};Object.assign(tgt,body);render();
   try{await API().update(s.id,body);toast("✅ Изменения сохранены");}catch(e){Object.assign(tgt,old);render();toast("Ошибка","err");}}
  else{const tmp={...body,id:Date.now(),is_paused:false,position:S.subs.length,created_at:new Date().toISOString()};S.subs.push(tmp);S.view="subs";render();
   try{const real=await API().create(body);const i=S.subs.findIndex(x=>x.id===tmp.id);if(i>-1)S.subs[i]=real;render();toast("✅ Подписка создана");}
   catch(e){S.subs=S.subs.filter(x=>x.id!==tmp.id);render();toast("Ошибка создания","err");}}};
 if(isEdit)$("#dDel").onclick=()=>{closeDrawer();doDelete([s.id]);};}
function renderSearch(){$("#scopeSel").innerHTML='<option value="">Все активные подписки</option>'+S.subs.filter(s=>!s.is_paused).map(s=>`<option value="${s.id}">${esc(s.keyword)}</option>`).join("");
 $("#limVal").textContent=S.limit;
 $("#searchResults").innerHTML=S.results.length?S.results.map(resCard).join(""):`<div class="empty"><div class="ico">📡</div><p>Запустите поиск — результаты появятся здесь и в чате.</p></div>`;bindRes();}
$("#limMinus").onclick=()=>{S.limit=Math.max(1,S.limit-1);$("#limVal").textContent=S.limit;};
$("#limPlus").onclick=()=>{S.limit=Math.min(50,S.limit+1);$("#limVal").textContent=S.limit;};
$("#runBtn").onclick=async()=>{$("#runBtn").disabled=true;$("#runBtn").textContent="⏳ Сканирую ЕИС…";
 $("#searchResults").innerHTML=`<div class="empty"><div class="ico">🛰️</div><p>Идёт поиск…</p></div>`;
 try{const r=await API().search(S.limit,+$("#scopeSel").value||null);S.results=r.results;
  toast(r.found?`📡 Найдено: ${r.found}. Отправлено в чат.`:"Новых закупок не найдено",r.found?"ok":"info");
  const st=await API().state();S.history=st.history;render();}
 catch(e){toast("Ошибка поиска","err");renderSearch();}
 $("#runBtn").disabled=false;$("#runBtn").textContent="📡 Запустить поиск";};
function daysLeft(dl){const m=String(dl).match(/(\d{2})\.(\d{2})\.(\d{4})/);if(!m)return null;return Math.ceil((new Date(+m[3],+m[2]-1,+m[1])-Date.now())/864e5);}
function resCard(z,i){const dl=daysLeft(z.deadline);const cls=dl==null?"cool":dl<=3?"hot":dl<=7?"warm":"cool";const isFav=S.favs.some(f=>f.reg_number===z.reg_number);
 return `<div class="card res" style="animation-delay:${i*40}ms"><div class="row1"><span class="tag law">№ ${esc(z.reg_number)}</span><span class="deadline ${cls}">${dl==null?"⏳ срок уточняется":dl<=0?"⚠️ сегодня последний день":"⏳ осталось "+dl+" дн."}</span><button class="star ${isFav?"on":""}" data-fav="${esc(z.reg_number)}" style="margin-left:auto">⭐</button></div>
 <div class="title">${esc(z.title)}</div><div class="grid"><span>💰 <b>${esc(z.price)}</b></span><span>📅 <b>${esc(z.deadline)}</b></span><span>📍 <b>${esc(z.region)}</b></span><span>🏢 <b>${esc(z.customer)}</b></span></div>
 <a class="link" href="${esc(z.link)}" target="_blank">🔗 Открыть на zakupki.gov.ru →</a></div>`;}
function bindRes(){$$("#searchResults .star").forEach(b=>b.onclick=async()=>{const reg=b.dataset.fav;const z=S.results.find(x=>x.reg_number===reg);const has=S.favs.some(f=>f.reg_number===reg);
 if(has){S.favs=S.favs.filter(f=>f.reg_number!==reg);b.classList.remove("on");try{await API().delFav(reg);}catch(e){}}
 else{S.favs.unshift(z);b.classList.add("on");try{await API().addFav(z);toast("⭐ В избранном");}catch(e){}}
 $("#stFav").textContent=S.favs.length;});}
function renderFavs(){$("#favList").innerHTML=S.favs.length?S.favs.map((f,i)=>`<div class="card res" style="animation-delay:${i*40}ms"><div class="row1"><span class="tag law">№ ${esc(f.reg_number)}</span><button class="btn danger icon" data-rmfav="${esc(f.reg_number)}" style="margin-left:auto">🗑</button></div>
 <div class="title">${esc(f.title||"Без названия")}</div><div class="grid"><span>💰 <b>${esc(f.price||"—")}</b></span><span>📅 <b>${esc(f.deadline||"—")}</b></span><span>📍 <b>${esc(f.region||"—")}</b></span><span>🏢 <b>${esc(f.customer||"—")}</b></span></div>
 <a class="link" href="${esc(f.link)}" target="_blank">🔗 Открыть закупку →</a></div>`).join(""):`<div class="empty"><div class="ico">⭐</div><p>Избранное пусто.<br>Добавляйте кнопкой ⭐ в поиске или в чате.</p></div>`;
 $$("#favList [data-rmfav]").forEach(b=>b.onclick=async()=>{const reg=b.dataset.rmfav;const removed=S.favs.find(f=>f.reg_number===reg);S.favs=S.favs.filter(f=>f.reg_number!==reg);render();
  snack("Удалено из избранного",async()=>{S.favs.unshift(removed);render();try{await API().addFav(removed);}catch(e){}});
  try{await API().delFav(reg);}catch(e){}});}
function renderHist(){$("#histList").innerHTML=S.history.length?S.history.map((h,i)=>`<div class="card hist" style="animation-delay:${i*30}ms"><div class="when">${new Date(h.searched_at).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div><div class="body"><div class="kw" style="font-size:14px">🔎 ${esc(h.query)}</div><div class="meta" style="margin-top:4px">лимит ${h.limit_count} · найдено <b style="color:${h.found_count?"var(--ok)":"var(--muted)"}">${h.found_count}</b></div></div><button class="btn ghost sm" data-rerun="1">↻</button></div>`).join(""):`<div class="empty"><div class="ico">🕘</div><p>История поисков пуста.</p></div>`;
 $$("#histList [data-rerun]").forEach(b=>b.onclick=()=>{S.view="search";render();$("#runBtn").click();});}
$("#clearHist").onclick=async()=>{const old=[...S.history];S.history=[];render();snack("История очищена",()=>{S.history=old;render();});try{await API().clearHist();}catch(e){S.history=old;render();}};
(async function boot(){$("#modeTxt").textContent=S.mode==="live"?"LIVE":"DEMO";$("#modeChip").classList.toggle("demo",S.mode!=="live");
 $("#avatar").textContent=(S.user.first_name||"?")[0].toUpperCase();
 try{const st=await API().state();S.subs=st.subs;S.favs=st.favs;S.history=st.history;}
 catch(e){S.mode="demo";$("#modeTxt").textContent="DEMO";$("#modeChip").classList.add("demo");const st=await Demo.state();S.subs=st.subs;S.favs=st.favs;S.history=st.history;toast("Supabase недоступен — демо-режим","info");}
 render();})();
</script>
</body>
</html>
